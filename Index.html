<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delboni Medicina Diagnóstica | Cursos Profissionais</title>
<meta name="description" content="Delboni Medicina Diagnóstica — Cursos Profissionais Online">
<style>
:root {
  --pink:#ec0075; --pink2:#c90063; --soft:#fff2f8; --ink:#26313d;
  --muted:#687381; --line:#e7e9ed; --dark:#252a31; --white:#fff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{text-decoration:none}
.topline{height:5px;background:linear-gradient(90deg,#c90063,#ff2390,#c90063)}
.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1220px;margin:auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:25px}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink)}
.brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid #fff;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.brand-name{font-size:18px;font-weight:900;letter-spacing:-.4px}
.brand-name small{display:block;color:#7a818a;font-size:9px;letter-spacing:1.15px;margin-top:2px}
.menu{display:flex;align-items:center;gap:26px}
.menu a{font-size:13px;font-weight:800;color:#46505b}
.menu a:hover{color:var(--pink)}
.menu .insta{color:var(--pink)}
.header-wa{background:var(--pink);color:#fff;padding:12px 18px;border-radius:999px;font-size:12px;font-weight:900;box-shadow:0 8px 20px rgba(236,0,117,.2)}

.hero{min-height:570px;position:relative;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#fff5fa 52%,#f1f2f4 100%);}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 30%,rgba(236,0,117,.13),transparent 30%),linear-gradient(180deg,transparent 70%,rgba(255,255,255,.9));pointer-events:none}
.hero-inner{max-width:1220px;margin:auto;min-height:570px;padding:75px 24px;display:flex;align-items:center;position:relative;z-index:1}
.hero-copy{max-width:650px}
.eyebrow{color:var(--pink);font-weight:900;letter-spacing:1.7px;text-transform:uppercase;font-size:12px}
.hero h1{font-size:clamp(40px,6vw,70px);line-height:1;letter-spacing:-3.5px;margin:13px 0 20px;color:#34404d}
.hero h1 span{color:var(--pink)}
.hero p{font-size:18px;line-height:1.65;color:#5e6874;max-width:610px}
.hero-buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:14px 20px;font-weight:900;font-size:13px}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 10px 25px rgba(236,0,117,.2)}
.btn-light{background:#fff;color:#333;border:1px solid #ddd}
.signature{display:flex;gap:25px;flex-wrap:wrap;margin-top:38px}
.signature div{display:flex;gap:9px;align-items:center;color:#34404d;font-size:13px;font-weight:800}
.dot{width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--pink);font-weight:900}

.section{max-width:1220px;margin:auto;padding:70px 24px}
.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}
.heading .eyebrow{margin-bottom:7px}
.heading h2{font-size:38px;letter-spacing:-1.5px;margin:0}
.heading p{color:var(--muted);margin:7px 0 0;font-size:15px}
.catalog-badge{background:var(--soft);color:#4d5661;border-radius:14px;padding:13px 17px;font-size:12px;font-weight:800}
.catalog-badge b{color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.course-card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px;box-shadow:0 7px 25px rgba(30,35,45,.045);min-height:236px;display:flex;flex-direction:column;transition:.2s}
.course-card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(30,35,45,.09);border-color:#f2c3d9}
.course-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.course-meta span{font-size:10px;font-weight:900;color:var(--pink);letter-spacing:1px}
.course-meta strong{font-size:23px;color:#222;white-space:nowrap}
.course-card h3{font-size:19px;line-height:1.2;margin:17px 0 9px;letter-spacing:-.4px}
.course-card p{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0 0 19px;flex:1}
.course-action{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pink);color:#fff;border-radius:10px;padding:12px;font-size:13px;font-weight:900}
.course-action:hover{background:var(--pink2)}
.wa-icon{width:19px;height:19px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:10px}

.how{background:linear-gradient(135deg,#fff4f9,#fafafa);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.how-grid{max-width:1220px;margin:auto;padding:65px 24px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.how h2{font-size:37px;margin:0 0 10px;color:var(--pink)}
.how-intro{color:var(--muted);line-height:1.6}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}
.step-num{width:38px;height:38px;border-radius:50%;border:2px solid #ff79b7;color:var(--pink);display:grid;place-items:center;font-weight:900;margin-bottom:12px}
.step b{font-size:13px;display:block;margin-bottom:6px}
.step span{font-size:12px;line-height:1.4;color:var(--muted)}
.requirements{background:#fff;border:1px solid #f0d2e1;border-radius:20px;padding:27px;box-shadow:0 8px 25px rgba(30,35,45,.04)}
.requirements h3{margin:0 0 14px;font-size:19px}
.requirements ul{margin:0;padding-left:19px;color:#59636f;line-height:1.9;font-size:14px}

.contact{background:linear-gradient(120deg,#b9005b,#f0007c);color:#fff;text-align:center;padding:55px 24px}
.contact h2{font-size:35px;margin:0 0 8px;letter-spacing:-1px}
.contact p{opacity:.9;margin:0 0 18px}
.contact a{display:inline-block;background:#fff;color:var(--pink2);border-radius:10px;padding:14px 21px;font-weight:900;font-size:13px}

footer{background:var(--dark);color:#cbd0d6;padding:38px 24px 30px}
.footer-inner{max-width:1220px;margin:auto;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:25px}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-brand img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:center}
.footer strong{color:#fff}
.footer h4{color:#fff;margin:0 0 10px;font-size:13px}
.footer p,.footer a{font-size:12px;color:#b8bec6;line-height:1.7}
.footer a:hover{color:#ff5da5}
.legal{max-width:1220px;margin:25px auto 0;padding-top:20px;border-top:1px solid #3a4048;text-align:center;font-size:11px;color:#9da4ad;line-height:1.7}

@media(max-width:950px){.menu{gap:12px}.header-wa{display:none}.grid{grid-template-columns:repeat(2,1fr)}.how-grid{grid-template-columns:1fr}.footer-inner{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.nav{padding:11px 15px}.brand img{width:47px;height:47px}.brand-name{font-size:16px}.menu a:not(.insta){display:none}.hero,.hero-inner{min-height:610px}.hero-inner{padding:55px 18px;align-items:flex-start}.hero h1{font-size:43px;letter-spacing:-2.2px}.hero p{font-size:16px}.section{padding:50px 18px}.heading{display:block}.heading h2{font-size:31px}.catalog-badge{display:inline-block;margin-top:16px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.footer-inner{grid-template-columns:1fr}}
</style>
</head>
